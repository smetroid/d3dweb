<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="d3dweb — Graphs, live.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="50%" stop-color="#1a1046"/>
      <stop offset="100%" stop-color="#2a0b3a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.25" r="0.55">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.7" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.55" cy="0.95" r="0.35">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>
  <rect width="1200" height="630" fill="url(#glowC)"/>

  <!-- grid -->
  <g stroke="#a78bfa" stroke-opacity="0.06">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630"/>
  </g>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="80" r="1.5" opacity="0.6"/>
    <circle cx="340" cy="140" r="1" opacity="0.5"/>
    <circle cx="180" cy="480" r="1.2" opacity="0.5"/>
    <circle cx="60" cy="360" r="1" opacity="0.4"/>
    <circle cx="1120" cy="120" r="1.5" opacity="0.6"/>
    <circle cx="980" cy="520" r="1" opacity="0.5"/>
    <circle cx="1050" cy="380" r="1.2" opacity="0.4"/>
    <circle cx="720" cy="60" r="1" opacity="0.5"/>
  </g>

  <!-- brand -->
  <g transform="translate(60,54)">
    <rect x="0" y="0" width="28" height="28" rx="7" fill="#a78bfa"/>
    <rect x="0" y="0" width="28" height="28" rx="7" fill="url(#edge)" opacity="0.85"/>
    <text x="42" y="21" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="0.5">d3dweb</text>
  </g>

  <!-- eyebrow pill -->
  <g transform="translate(60,120)">
    <rect x="0" y="0" width="230" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.5"/>
    <circle cx="18" cy="17" r="4" fill="#3fb950"/>
    <text x="32" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#22d3ee" letter-spacing="2">LIVE MULTI-USER · V0.X</text>
  </g>

  <!-- title -->
  <g transform="translate(60,180)">
    <text x="0" y="80" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="96" fill="url(#title)" letter-spacing="-2">Graphs, live.</text>
  </g>

  <!-- subtitle -->
  <g transform="translate(60,300)">
    <text x="0" y="32" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" fill="#c4b5fd" opacity="0.92">Real-time collaborative DAG editor.</text>
    <text x="0" y="66" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" fill="#c4b5fd" opacity="0.92">Vim keys. Signed share links. Zero setup.</text>
  </g>

  <!-- feature chips -->
  <g transform="translate(60,440)" font-family="ui-monospace, monospace" font-size="13" fill="#e9d5ff">
    <g>
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="18" y="22">▸ Vue 3 + Vite</text>
    </g>
    <g transform="translate(162,0)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-opacity="0.4"/>
      <text x="18" y="22">▸ Cytoscape.js</text>
    </g>
    <g transform="translate(324,0)">
      <rect x="0" y="0" width="170" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#f472b6" stroke-opacity="0.4"/>
      <text x="18" y="22">▸ WebSocket relay</text>
    </g>
    <g transform="translate(506,0)">
      <rect x="0" y="0" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="18" y="22">▸ MIT · Free</text>
    </g>
  </g>

  <!-- URL footer -->
  <g transform="translate(60,570)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="16" fill="#22d3ee" opacity="0.9">github.com/smetroid/d3dweb</text>
    <text x="0" y="26" font-family="Inter, sans-serif" font-size="13" fill="#a9a3c9">Built for engineers who think in graphs</text>
  </g>

  <!-- Graph card on the right -->
  <g transform="translate(680,110)">
    <rect x="0" y="0" width="460" height="410" rx="24" fill="url(#glass)" stroke="#a78bfa" stroke-opacity="0.3"/>
    <rect x="0" y="0" width="460" height="1" fill="url(#hairline)"/>

    <!-- chrome -->
    <g transform="translate(20,22)">
      <circle cx="6" cy="6" r="5" fill="#ef4444"/>
      <circle cx="22" cy="6" r="5" fill="#eab308"/>
      <circle cx="38" cy="6" r="5" fill="#3fb950"/>
      <rect x="60" y="-4" width="240" height="20" rx="5" fill="#000000" fill-opacity="0.35"/>
      <text x="70" y="10" font-family="ui-monospace, monospace" font-size="10" fill="#a9a3c9">d3d.local/diagram/pipeline-v2</text>

      <!-- avatars -->
      <g transform="translate(340,-4)">
        <circle cx="10" cy="6" r="10" fill="#a78bfa" stroke="#1a1046" stroke-width="2"/>
        <text x="10" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="9" fill="#0b1024">Y</text>
        <circle cx="26" cy="6" r="10" fill="#22d3ee" stroke="#1a1046" stroke-width="2"/>
        <text x="26" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="9" fill="#0b1024">T</text>
        <circle cx="42" cy="6" r="10" fill="#f472b6" stroke="#1a1046" stroke-width="2"/>
        <text x="42" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="9" fill="#0b1024">A</text>
      </g>
    </g>

    <!-- graph canvas -->
    <rect x="20" y="60" width="420" height="330" rx="14" fill="#05070f" fill-opacity="0.55" stroke="#a78bfa" stroke-opacity="0.15"/>

    <!-- edges -->
    <g transform="translate(20,60)" stroke="url(#edge)" stroke-width="2" fill="none" opacity="0.9">
      <path d="M60 165 C 140 165, 160 80, 220 80"/>
      <path d="M60 165 C 140 165, 160 165, 220 165"/>
      <path d="M60 165 C 140 165, 160 250, 220 250"/>
      <path d="M220 80 C 290 80, 310 165, 360 165"/>
      <path d="M220 165 C 290 165, 310 165, 360 165"/>
      <path d="M220 250 C 290 250, 310 165, 360 165"/>
    </g>

    <!-- nodes -->
    <g transform="translate(20,60)" font-family="ui-monospace, monospace" font-size="11">
      <circle cx="60" cy="165" r="20" fill="#0b1024" stroke="#a78bfa" stroke-width="2"/>
      <text x="60" y="169" text-anchor="middle" fill="#c4b5fd">in</text>

      <circle cx="220" cy="80" r="20" fill="#0b1024" stroke="#22d3ee" stroke-width="2"/>
      <text x="220" y="84" text-anchor="middle" fill="#a5f3fc">map</text>

      <circle cx="220" cy="165" r="20" fill="#0b1024" stroke="#a78bfa" stroke-width="2"/>
      <text x="220" y="169" text-anchor="middle" fill="#c4b5fd">tx</text>

      <circle cx="220" cy="250" r="20" fill="#0b1024" stroke="#f472b6" stroke-width="2"/>
      <text x="220" y="254" text-anchor="middle" fill="#fbcfe8">log</text>

      <circle cx="360" cy="165" r="20" fill="#0b1024" stroke="#22d3ee" stroke-width="2"/>
      <text x="360" y="169" text-anchor="middle" fill="#a5f3fc">sink</text>

      <!-- presence halos -->
      <circle cx="220" cy="165" r="28" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.85"/>
      <circle cx="360" cy="165" r="28" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.85"/>
    </g>
  </g>
</svg>
