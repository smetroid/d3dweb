<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="d3dweb hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1024"/>
      <stop offset="50%" stop-color="#1a1046"/>
      <stop offset="100%" stop-color="#2a0b3a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.75" r="0.4">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="720" height="240" rx="16" fill="url(#bg)"/>
  <rect width="720" height="240" rx="16" fill="url(#glow1)"/>
  <rect width="720" height="240" rx="16" fill="url(#glow2)"/>

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 40 H720 M0 80 H720 M0 120 H720 M0 160 H720 M0 200 H720"/>
    <path d="M40 0 V240 M120 0 V240 M200 0 V240 M280 0 V240 M360 0 V240 M440 0 V240 M520 0 V240 M600 0 V240 M680 0 V240"/>
  </g>

  <!-- DAG on the right -->
  <g transform="translate(430,30)" opacity="0.95">
    <!-- edges -->
    <path d="M40 40 C 90 40, 110 100, 160 100" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <path d="M40 40 C 90 40, 110 20, 160 20" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <path d="M160 20 C 200 20, 200 100, 240 100" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <path d="M160 100 C 200 100, 200 160, 240 160" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <path d="M40 40 C 90 40, 110 160, 160 160" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <path d="M160 160 C 200 160, 200 100, 240 100" fill="none" stroke="url(#edge)" stroke-width="2"/>

    <!-- nodes -->
    <g>
      <circle cx="40" cy="40" r="14" fill="#0b1024" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="160" cy="20" r="14" fill="#0b1024" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="160" cy="100" r="14" fill="#0b1024" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="160" cy="160" r="14" fill="#0b1024" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="240" cy="100" r="14" fill="#0b1024" stroke="#f472b6" stroke-width="2"/>
      <circle cx="240" cy="160" r="14" fill="#0b1024" stroke="#a78bfa" stroke-width="2"/>
    </g>

    <!-- presence halo on one node -->
    <circle cx="160" cy="100" r="22" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
    <circle cx="240" cy="100" r="22" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
  </g>

  <!-- Title block -->
  <g transform="translate(40,64)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#22d3ee" letter-spacing="6">D3DWEB</text>
    <text x="0" y="56" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="44" fill="url(#title)">Graphs, live.</text>
    <text x="0" y="94" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#c4b5fd" opacity="0.9">Real-time collaborative DAG editor.</text>
    <text x="0" y="116" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#c4b5fd" opacity="0.9">Vim keys. Signed share links. Zero setup.</text>

    <!-- pill -->
    <g transform="translate(0,140)">
      <rect x="0" y="0" width="150" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.5"/>
      <circle cx="14" cy="13" r="4" fill="#3fb950"/>
      <text x="26" y="17" font-family="ui-monospace, monospace" font-size="11" fill="#e9d5ff">2 peers · live</text>
    </g>
  </g>
</svg>
