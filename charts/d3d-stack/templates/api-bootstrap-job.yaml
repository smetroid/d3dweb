{{- if .Values.api.bootstrapUser.enabled -}}
{{- $component := "api" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-api-bootstrap-user
  labels:
    {{- include "d3d-stack.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "d3d-stack.componentLabels" (dict "root" . "component" $component) | nindent 8 }}
        app.kubernetes.io/role: bootstrap
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Release.Name }}-api {{ .Values.api.port }}; do
                echo "waiting for api"
                sleep 2
              done
        - name: render-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              SIGNING_KEY=$(cat /etc/api-secret/signing_key)
              sed "s|__SIGNING_KEY__|${SIGNING_KEY}|" \
                /etc/api-config/samus.toml.tmpl > /etc/samus/samus.toml
          volumeMounts:
            - name: api-config-tmpl
              mountPath: /etc/api-config
              readOnly: true
            - name: api-secret
              mountPath: /etc/api-secret
              readOnly: true
            - name: samus-config
              mountPath: /etc/samus
      containers:
        - name: create-user
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy | default .Values.global.imagePullPolicy }}
          workingDir: /root
          command: ["./main"]
          args:
            - createUser
            - {{ .Values.api.bootstrapUser.username | quote }}
            - {{ .Values.api.bootstrapUser.password | quote }}
            - --config
            - /etc/samus/samus.toml
          volumeMounts:
            - name: samus-config
              mountPath: /etc/samus
              readOnly: true
      volumes:
        - name: api-config-tmpl
          configMap:
            name: {{ .Release.Name }}-api-config
        - name: api-secret
          secret:
            secretName: {{ .Release.Name }}-api-secret
        - name: samus-config
          emptyDir: {}
{{- end }}
