{{- $component := "rethinkdb" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-{{ $component }}
  labels:
    {{- include "d3d-stack.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-{{ $component }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "d3d-stack.componentSelector" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "d3d-stack.componentLabels" (dict "root" . "component" $component) | nindent 8 }}
    spec:
      containers:
        - name: rethinkdb
          image: {{ .Values.rethinkdb.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["rethinkdb", "--bind", "all", "--directory", "/data/rethinkdb"]
          ports:
            - name: driver
              containerPort: 28015
            - name: cluster
              containerPort: 29015
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: driver
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: driver
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.rethinkdb.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.rethinkdb.storageClass }}
        storageClassName: {{ .Values.rethinkdb.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.rethinkdb.storage }}
