{{- $component := "api" -}}
{{- $rethinkAddr := .Values.api.config.rethinkAddress | default (printf "%s-rethinkdb:28015" .Release.Name) -}}
{{- $rethinkHost := (splitList ":" $rethinkAddr) | first -}}
{{- $rethinkPort := (splitList ":" $rethinkAddr) | last -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "d3d-stack.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "d3d-stack.componentSelector" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "d3d-stack.componentLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/api-secret.yaml") . | sha256sum }}
    spec:
      initContainers:
        - name: wait-rethinkdb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "waiting for {{ $rethinkHost }}:{{ $rethinkPort }}"
              until nc -z {{ $rethinkHost }} {{ $rethinkPort }}; do
                sleep 2
              done
              echo "rethinkdb is up"
        - name: render-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              SIGNING_KEY=$(cat /etc/api-secret/signing_key)
              sed "s|__SIGNING_KEY__|${SIGNING_KEY}|" \
                /etc/api-config/samus.toml.tmpl > /etc/samus/samus.toml
              echo "rendered /etc/samus/samus.toml"
          volumeMounts:
            - name: api-config-tmpl
              mountPath: /etc/api-config
              readOnly: true
            - name: api-secret
              mountPath: /etc/api-secret
              readOnly: true
            - name: samus-config
              mountPath: /etc/samus
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy | default .Values.global.imagePullPolicy }}
          workingDir: /root
          command: ["./main"]
          args: ["--config", "/etc/samus/samus.toml"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: samus-config
              mountPath: /etc/samus
              readOnly: true
      volumes:
        - name: api-config-tmpl
          configMap:
            name: {{ .Release.Name }}-api-config
        - name: api-secret
          secret:
            secretName: {{ .Release.Name }}-api-secret
        - name: samus-config
          emptyDir: {}
