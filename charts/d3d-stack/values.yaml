global:
  domain: d3d.local
  imagePullPolicy: IfNotPresent

postgresql:
  image: postgres:16-alpine
  username: samus
  password: dev-password-change-in-prod
  database: samus
  storage: 1Gi
  storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

api:
  image:
    repository: d3d-api
    tag: dev
    pullPolicy: ""
  replicas: 1
  port: 8081
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    bindAddr: ":8081"
    signingKey: dev-signing-key-change-in-prod
    authProvider: localauth
    # postgresAddress defaults to <release>-postgresql:5432 when empty
    postgresAddress: ""
    continuousQueryInterval: 5s
    logDagRequests: true
    logEdgeRequests: false
    logNodeRequests: false
    logMenuRequests: false
  bootstrapUser:
    enabled: false
    username: admin
    password: admin

web:
  image:
    repository: d3dweb
    tag: dev
    pullPolicy: ""
  replicas: 1
  collabEnabled: true
  apiBaseUrl: /api

ingress:
  enabled: true
  className: nginx
  host: d3d.local
